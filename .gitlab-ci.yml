# ============================================================================
# Harmony-GGUF — GitCode CI 流水线（GitLab CI）
# ============================================================================
# 角色 C（质量保障）维护，阶段 0 交付物
#
# Runner 要求：
#   - lint / unit-test 阶段：标准 Node.js 18+ 环境（可用共享 Runner）
#   - build 阶段：需安装 DevEco Studio + OHOS SDK 26.0.0 的自托管 Runner，
#     标签设为 ohos-sdk
# ============================================================================

stages:
  - lint
  - build
  - test

variables:
  # hvigorw 路径（自托管 Runner 上 DevEco Studio 安装路径）
  DEVECO_HOME: "D:/Programs/DevEco Studio"
  HVIGORW: "$DEVECO_HOME/tools/hvigor/bin/hvigorw.bat"
  # 构建产物路径
  HAP_OUTPUT: "entry/build/default/outputs/default"

# ----------------------------------------------------------------------------
# 阶段 1：代码检查（ArkTS lint）
# 标准环境即可运行，不需要 OHOS SDK
# ----------------------------------------------------------------------------
code-linter:
  stage: lint
  image: node:18
  tags:
    - shared
  only:
    - main
    - merge_requests
    - /^phase\d+.*$/
  script:
    - echo "=== ArkTS 代码检查 ==="
    - chmod +x scripts/ci-lint.sh || true
    - bash scripts/ci-lint.sh
  artifacts:
    when: always
    reports:
      junit: reports/lint-report.xml
    paths:
      - reports/
    expire_in: 1 week
  allow_failure: false

# ----------------------------------------------------------------------------
# 阶段 2：构建 HAP（需要 OHOS SDK 自托管 Runner）
# ----------------------------------------------------------------------------
build-hap:
  stage: build
  tags:
    - ohos-sdk
  only:
    - main
    - merge_requests
    - /^phase\d+.*$/
  before_script:
    - echo "=== 检查 OHOS SDK 环境 ==="
    - test -f "$HVIGORW" || (echo "hvigorw 未找到，请确认 DEVECO_HOME 配置" && exit 1)
  script:
    - echo "=== 构建 HAP ==="
    - chmod +x scripts/ci-build.sh || true
    - bash scripts/ci-build.sh
  artifacts:
    when: always
    paths:
      - "$HAP_OUTPUT/*.hap"
      - reports/
    expire_in: 2 weeks
  allow_failure: false

# ----------------------------------------------------------------------------
# 阶段 3：单元测试（ArkTS hypium）
# 需要 OHOS SDK 环境编译，可在模拟器或真机执行
# ----------------------------------------------------------------------------
unit-test:
  stage: test
  tags:
    - ohos-sdk
  only:
    - main
    - merge_requests
    - /^phase\d+.*$/
  needs:
    - build-hap
  script:
    - echo "=== ArkTS 单元测试 ==="
    - chmod +x scripts/ci-test.sh || true
    - bash scripts/ci-test.sh
  artifacts:
    when: always
    reports:
      junit: reports/test-report.xml
    paths:
      - reports/
    expire_in: 2 weeks
  allow_failure: false

# ----------------------------------------------------------------------------
# C++ 引擎测试（本地编译运行，阶段 1 起启用）
# ----------------------------------------------------------------------------
cpp-test:
  stage: test
  tags:
    - ohos-sdk
  only:
    - main
    - /^phase\d+.*$/
  script:
    - echo "=== C++ 引擎测试 ==="
    - chmod +x scripts/ci-cpp-test.sh || true
    - bash scripts/ci-cpp-test.sh || echo "C++ 测试暂未接入，跳过"
  allow_failure: true
