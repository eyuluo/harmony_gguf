name: Runner Test

on:
  workflow_dispatch:

jobs:
  test-runner:
    runs-on: [self-hosted, Windows, X64, ohos-sdk]

    steps:
      - name: Check environment
        shell: powershell
        run: |
          Write-Host "Runner: $env:RUNNER_NAME"
          Write-Host "OS: $env:RUNNER_OS"
          Write-Host "Architecture: $env:RUNNER_ARCH"

      - name: Check tools
        shell: powershell
        run: |
          git --version
          node --version
          npm --version
          cmake --version
          ohpm --version
          hvigorw --version

      - name: Check HarmonyOS SDK
        shell: powershell
        run: |
          Write-Host "DEVECO_HOME=$env:DEVECO_HOME"
          Write-Host "OHOS_SDK_HOME=$env:OHOS_SDK_HOME"